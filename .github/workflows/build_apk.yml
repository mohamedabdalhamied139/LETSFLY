name: Build Mobile Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Generate Android platform scaffold
        working-directory: ./mobile
        run: |
          flutter create . --platforms=android --org com.tableverse --project-name tableverse_mobile
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r', encoding='utf-8') as f:
              content = f.read()
          perms = '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <application android:usesCleartextTraffic=\"true\"'
          content = content.replace('<application', perms, 1)
          with open(p, 'w', encoding='utf-8') as f:
              f.write(content)
          "
          # Set minSdkVersion 21 for flutter_tts compatibility
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tableverse-mobile-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
