name: tableverse_mobile
description: TableVerse accessible cross-platform mobile application for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & Real-Time Communication
  dio: ^5.4.0
  web_socket_channel: ^2.4.1

  # Local Persistence & Secure Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Audio & Sound Effects
  audioplayers: ^5.2.1

  # Screen Reader Speech (TTS) fallback & utility
  flutter_tts: ^3.8.5

  # Cupertino Icons for iOS UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/locales/
    - assets/sounds/
